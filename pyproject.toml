[project]
name = "yeaboi-tooling"
version = "0.1.0"
description = "Shared development tooling for the yeaboi repos. Not a distribution — this file exists so the guards have a pinned test runner."
# 3.11 for tomllib: the guard that holds scripts/workspace.py's hand-rolled
# manifest reader to a real TOML parser needs one in the standard library,
# and a guard that skips itself on an older interpreter is not a guard.
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

# Nothing here is importable, so there is nothing to build or install.
[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
