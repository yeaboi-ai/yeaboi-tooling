# The cross-repo check nobody's PR can run.
#
# Every other gate in this fleet asks "is this change green against the pins I
# already have?". Nothing asks "would these repos still be green against the
# contracts and packages as they are RIGHT NOW?" — and nothing can, because the
# answer changes when a *different* repo merges or publishes. A front end can
# ship a broken package at noon and the desktop app finds out at its next PR,
# which may be a fortnight away.
#
# So this runs on a clock, against tips and latest releases rather than pins,
# and files one issue when it goes red.
name: nightly

on:
  schedule:
    # Early enough to be waiting in the morning, off the hour because GitHub's
    # scheduler queues everything submitted at :00.
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  plan:
    name: Read the workspace manifest
    runs-on: ubuntu-latest
    outputs:
      repos: ${{ steps.matrix.outputs.repos }}
    steps:
      - uses: actions/checkout@v7
      # workspace.toml is the one list of repos; a matrix hard-coded here would
      # be a sixth repo's worth of drift waiting to happen.
      - id: matrix
        run: echo "repos=$(python3 scripts/workspace.py matrix)" >> "$GITHUB_OUTPUT"

  contracts:
    name: ${{ matrix.repo.name }} against today's contracts
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        repo: ${{ fromJSON(needs.plan.outputs.repos) }}
    env:
      # `npm ci` otherwise pulls the ~100MB Electron binary, which nothing here
      # runs — the renderer builds and the tests mock the electron module.
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ matrix.repo.slug }}

      # Both toolchains, unconditionally: the front end's own gate builds a
      # Python wheel, so "node repo" does not mean "no uv".
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - uses: actions/setup-node@v6
        if: matrix.repo.toolchain == 'node'
        with:
          node-version-file: .nvmrc

      - run: make install

      - name: Take the contracts as they are on yeaboi.ai@main
        run: |
          before="$(tr -d '[:space:]' < .contracts-rev)"
          make contracts-sync
          after="$(tr -d '[:space:]' < .contracts-rev)"
          if [ "$before" = "$after" ]; then
            echo "the pin is current (${before:0:12})"
          else
            echo "::notice::pin ${before:0:12} -> ${after:0:12}; this repo is running against contracts it has not vendored yet"
            git --no-pager diff --stat
          fi

      # The repo's OWN gate, not a checklist maintained here: whatever it
      # trusts before shipping is what it should survive against fresh
      # contracts. A red here means somebody must run `make contracts-sync`
      # there and fix what it surfaces — not that the nightly is wrong.
      - run: make ship-gate

  released:
    name: The published packages still satisfy yeaboi's guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          repository: yeaboi-ai/yeaboi.ai
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      # uv.lock pins an exact yeaboi-web-assets. Without this the job would
      # re-test the version yeaboi already tested, which is the one thing that
      # cannot have broken overnight.
      - name: Take the newest published web assets
        run: uv lock --upgrade-package yeaboi-web-assets

      - run: uv sync --extra dev --extra charts
      - name: Say which build is under test
        run: uv run python -c "import importlib.metadata as m; print('::notice::yeaboi-web-assets ' + m.version('yeaboi-web-assets'))"
      # The guards that read the SHIPPED bundles rather than any source tree:
      # CSP, no-CDN, IIFE-not-ESM, and the Python/TypeScript wire contracts.
      - run: uv run pytest tests/unit/test_web_assets.py tests/unit/test_web_contracts.py -q

  report:
    name: File the failure
    needs: [contracts, released]
    # 'skipped' too: a `plan` that fails takes the whole matrix with it,
    # and a nightly that files nothing when it could not even start is
    # indistinguishable from one that passed.
    if: always() && github.event_name == 'schedule' && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'skipped'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      # One issue, reopened by comment rather than duplicated: a nightly that
      # files a new issue every morning is a nightly people mute.
      - name: Open or update the standing issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TITLE: Nightly cross-repo check is red
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # The backticks below are markdown for the issue body, not command
          # substitution — which is exactly why those lines are single-quoted.
          # shellcheck disable=SC2016
          body="$(printf '%s\n' \
            'A repo would not be green against the contracts on `yeaboi.ai@main`, or against the packages as they are published now.' \
            '' \
            "Run: $RUN_URL" \
            '' \
            'Fix it where it belongs: `make contracts-sync` in the repo the run names, then whatever that surfaces. This issue is reused, so a new comment means it went red again.')"
          # Matched on the exact title rather than on a label: a label has to be
          # created before it can be used, and one that gets renamed silently
          # turns this into a new issue every morning.
          number="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title $TITLE" --json number,title \
            | python3 -c 'import json, os, sys; print(next((i["number"] for i in json.load(sys.stdin) if i["title"] == os.environ["TITLE"]), ""))')"
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body "$body"
            echo "commented on #$number"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "$body"
          fi
